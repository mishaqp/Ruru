name: Verify and publish Ruru 0.1.4 stable artifact
on:
  push:
    branches: ['ops/dispatch-ruru-0.1.4']
    paths: ['.github/workflows/publish-ruru-0.1.4.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.repository == 'mishaqp/Ruru' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify source, downloaded APK and publish only this stable artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo='mishaqp/Ruru'
          source='e2e2bca7606d506c7e290e8cffac5b685ab9f124'
          run=35079318293
          tag='v0.1.4-ruru.1'
          filename='Ruru-v0.1.4-ruru.1-arm64-v8a-release.apk'
          cert='5bc56f9c3cdf31d0b4762ab15ca2a571350abd6f1ce81c1678ecb2e9bf47e850'
          gh api "repos/$repo/actions/runs/$run" > run.json
          jq -e --arg sha "$source" '.head_sha == $sha and .conclusion == "success" and .path == ".github/workflows/release-ruru.yml"' run.json
          gh run download "$run" --repo "$repo" --name 'Ruru-0.1.4-ruru.1-arm64-v8a-release' --dir artifacts
          apk="$(find artifacts -type f -name "$filename")"
          test -n "$apk" && test -f "$apk"
          expected="$(awk '{print $1}' "$apk.sha256")"
          actual="$(sha256sum "$apk" | awk '{print $1}')"
          test "$actual" = "$expected"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          bt="$(find "$sdk/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)"
          "$bt/apksigner" verify --verbose --print-certs "$apk" > signature.txt
          grep -qE '^Number of signers: 1$' signature.txt
          signer="$(grep -m1 -E 'certificate SHA-256 digest:' signature.txt | sed 's/.*digest: *//' | tr -d ' :' | tr 'A-Z' 'a-z')"
          test "$signer" = "$cert"
          "$bt/aapt2" dump badging "$apk" > badging.txt
          grep -F "package: name='com.mishaqp.ruru'" badging.txt
          grep -F "versionName='0.1.4-ruru.1'" badging.txt
          grep -F "versionCode='10401'" badging.txt
          APK="$apk" python3 - <<'PY'
          import os, zipfile
          with zipfile.ZipFile(os.environ['APK']) as z:
              abis = {n.split('/')[1] for n in z.namelist() if n.startswith('lib/') and not n.endswith('/')}
              assert abis == {'arm64-v8a'}, abis
              manifest = z.read('AndroidManifest.xml')
              assert b'testOnly' not in manifest and 'testOnly'.encode('utf-16-le') not in manifest
              print('ABI/testOnly verified:', abis)
          PY
          printf '%s\n' "$cert" > RURU_SIGNING_CERT_SHA256.txt
          cat > notes.md <<'NOTES'
          ## Ruru 0.1.4-ruru.1 — исправления аудита

          Обычный подписанный stable APK, только **arm64-v8a**. Nightly не создавался.

          - Защищены аргументы действий и пользовательские данные от изменения при RU-локализации.
          - Исправлена ранняя остановка субагентов; обработка видео больше не блокирует основной JS-процесс синхронными ffmpeg/yt-dlp вызовами.
          - Обновление встроенных расширений через APK сохраняет пользовательские изменения; добавлено безопасное восстановление и сохранение старых lockfile.
          - Настроены общий API типов и проверки всех трёх встроенных расширений.
          - Удаление пакета честно сообщает об отложенной/неудачной перезагрузке.
          - Добавлены сроки ожидания обработчиков расширений и ограниченная FIFO-очередь событий Android-моста.

          Проверки: **73 runtime + 256 Android + 154 shared tests PASS**, typecheck bridge и трёх расширений PASS, EN/RU **1101 = 1101**, assembleDebug и assembleRelease PASS.

          `applicationId`: `com.mishaqp.ruru`  
          `versionName`: `0.1.4-ruru.1`  
          `versionCode`: `10401`  
          Постоянный сертификат SHA-256: `5bc56f9c3cdf31d0b4762ab15ca2a571350abd6f1ce81c1678ecb2e9bf47e850`

          APK предназначен для обновления прежней stable Ruru поверх установки. Не нужно удалять приложение или сбрасывать Alpine.

          Код: `e2e2bca7606d506c7e290e8cffac5b685ab9f124` (PR #10–14). Сборка: https://github.com/mishaqp/Ruru/actions/runs/35079318293

          Ограничения: физический телефон и реальные платные API не тестировались. Таймаут не останавливает синхронный бесконечный JS или произвольные внешние эффекты; лимит очереди ограничивает число событий, не размер одного события. Изменённые пользователем расширения автоматически не перезаписываются.
          NOTES
          gh release create "$tag" --repo "$repo" --target "$source" --title 'Ruru 0.1.4-ruru.1' --notes-file notes.md --latest "$apk" "$apk.sha256" RURU_SIGNING_CERT_SHA256.txt
          gh release download "$tag" --repo "$repo" --pattern "$filename" --dir published
          test "$(sha256sum "published/$filename" | awk '{print $1}')" = "$actual"
          "$bt/apksigner" verify --verbose --print-certs "published/$filename" > published-signature.txt
          echo "Published APK SHA-256: $actual"
          echo "Signing certificate SHA-256: $signer"
          echo 'Published APK independently downloaded and verified.'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ruru-0.1.4-publication-verification
          path: |
            run.json
            signature.txt
            published-signature.txt
            badging.txt
            notes.md
