name: Audit contracts development check
on:
  push:
    branches: ['fix/audit-contracts-no-nightly']
    paths: ['.github/workflows/audit-contract-probe.yml', 'scripts/audit-contracts-dev.py']
permissions:
  contents: write
concurrency:
  group: audit-contract-probe
  cancel-in-progress: true
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Apply inspected source changes
        if: hashFiles('scripts/audit-contracts-dev.py') != ''
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = 'fix/audit-contracts-no-nightly'
          python3 scripts/audit-contracts-dev.py
          npm install --prefix pi-bridge --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --check
          git add extensions/pi-mcp-adapter/aether.ts extensions/pi-subagents/src/aether.ts extensions/pi-web-access/aether.ts pi-bridge/package.json pi-bridge/package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: check bundled extensions against the shared Aether API'
            git push origin HEAD:refs/heads/fix/audit-contracts-no-nightly
          fi
      - name: Install compiler and SDK
        run: |
          npm ci --prefix pi-bridge --no-audit --no-fund
          npm ci --prefix packages/extension-api --no-audit --no-fund
          npm run check --prefix packages/extension-api
      - name: Check all bundled source and SDK contracts
        if: hashFiles('scripts/audit-contracts-dev.py') != ''
        shell: bash
        run: node scripts/check-bundled-extension-types.mjs 2>&1 | tee bundled-types.log
      - name: Check locale, bridge and real bundled runtime
        if: hashFiles('scripts/audit-contracts-dev.py') != ''
        shell: bash
        run: |
          python3 scripts/check-ruru-locales.py
          npm run check --prefix pi-bridge
          npm test --prefix pi-bridge 2>&1 | tee runtime-tests.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: contract-repair-reports
          path: |
            bundled-types.log
            runtime-tests.log
          retention-days: 7
