name: Bundled extension contracts
on:
  pull_request:
  push:
    branches: ['main']
    paths:
      - 'extensions/**'
      - 'packages/extension-api/**'
      - 'pi-bridge/package*.json'
      - 'scripts/check-bundled-extension-types.mjs'
      - '.github/workflows/bundled-extension-check.yml'
permissions:
  contents: read
concurrency:
  group: extension-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Node version
        run: node --version
      - name: Install pinned bridge compiler and Pi dependencies
        run: npm ci --prefix pi-bridge --no-audit --no-fund
      - name: Build and test shared extension API declarations
        run: |
          npm ci --prefix packages/extension-api --no-audit --no-fund
          npm run check --prefix packages/extension-api
      - name: Check every bundled source and erased SDK imports
        shell: bash
        run: node scripts/check-bundled-extension-types.mjs 2>&1 | tee bundled-types.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bundled-typecheck-report
          path: bundled-types.log
          retention-days: 14
