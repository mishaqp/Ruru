name: Ruru localization audit
on:
  push:
    branches: ['i18n/en-ru-only']
    paths: ['.github/workflows/i18n-audit.yml']
permissions:
  contents: read
concurrency:
  group: ruru-localization-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Audit locales and hardcoded UI strings
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee i18n-audit.txt) 2>&1
          echo '=== LOCALE DIRECTORIES ==='
          find shared/src/commonMain/composeResources -maxdepth 1 -type d -name 'values*' -printf '%f\n' | sort
          echo '=== LANGUAGE / LOCALE REFERENCES ==='
          rg -n --glob '*.kt' --glob '*.kts' --glob '*.xml' 'AppLanguage|LocaleConfig|localeConfig|languageTag|languageCode|Persian|Farsi|Chinese|Simplified|فارسی|简体|zh-rCN|values-fa|values-zh' app shared || true
          echo '=== ANDROID/COMPOSE HARD-CODED UI CANDIDATES ==='
          rg -n --glob '*.kt' 'Text\("[A-Za-z]|contentDescription\s*=\s*"[A-Za-z]|title\s*=\s*"[A-Za-z]|label\s*=\s*"[A-Za-z]|placeholder\s*=\s*"[A-Za-z]' app shared | head -n 1000 || true
          echo '=== EXTENSION USER-FACING STRING CANDIDATES ==='
          rg -n --glob '*.ts' --glob '*.tsx' --glob '*.js' --glob '*.mjs' --glob '!**/node_modules/**' --glob '!**/dist/**' 'description:\s*"[A-Za-z]|title:\s*"[A-Za-z]|label:\s*"[A-Za-z]|placeholder:\s*"[A-Za-z]|message:\s*"[A-Za-z]|name:\s*"[A-Za-z]|text:\s*"[A-Za-z]' extensions pi-bridge | head -n 1600 || true
          echo '=== LOCALE / LANGUAGE FILES ==='
          find app shared -type f \( -iname '*locale*' -o -iname '*language*' \) -print | sort
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ruru-i18n-audit
          path: i18n-audit.txt
          retention-days: 7
