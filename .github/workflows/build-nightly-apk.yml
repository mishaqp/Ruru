name: Build Nightly APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'shared/**'
      - 'pi-bridge/**'
      - 'packages/extension-api/**'
      - 'third_party/termux/terminal-emulator/**'
      - 'third_party/termux/terminal-view/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/build-nightly-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          cache-read-only: false

      # Fix: the `tools` package no longer exists in modern cmdline-tools,
      # so asking setup-android for it makes the whole job fail before Gradle runs.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Prepare Nightly Metadata
        id: nightly
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::12}"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "version_name=Nightly $short_sha" >> "$GITHUB_OUTPUT"

      # No NIGHTLY_* env on purpose: app/build.gradle.kts then falls back to the
      # debug signing config, so the build needs zero repository secrets.
      - name: Build Nightly APK
        env:
          VERSION_NAME: ${{ steps.nightly.outputs.version_name }}
        run: ./gradlew :app:assembleNightly --stacktrace -Paether.versionName="$VERSION_NAME"

      - name: Rename Nightly APK
        shell: bash
        env:
          SHORT_SHA: ${{ steps.nightly.outputs.short_sha }}
        run: |
          mkdir -p dist/nightly
          cp app/build/outputs/apk/nightly/app-nightly.apk "dist/nightly/Aether-nightly-${SHORT_SHA}.apk"

      - name: Upload Nightly APK
        uses: actions/upload-artifact@v7
        with:
          name: Aether-nightly
          path: dist/nightly/*.apk
