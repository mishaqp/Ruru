name: Publish reviewed Ruru 0.1.1
on:
  push:
    branches: ['ci/release-ruru-0.1.1']
    paths: ['.github/workflows/publish-reviewed-ruru.yml']
permissions:
  contents: write
  actions: write
  pull-requests: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tag the verified source and dispatch its unchanged release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/ci/release-ruru-0.1.1
          python3 - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'mishaqp/Ruru'
          base = os.environ['GITHUB_API_URL'] + '/repos/' + repo
          sha = '42c08ec45d5095dfb1eb59153b3d223acc35d769'
          tag = 'v0.1.1-ruru.1'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'}

          def api(path, data=None):
              payload = None if data is None else json.dumps(data).encode()
              request = Request(base + path, data=payload, headers=headers, method='GET' if data is None else 'POST')
              with urlopen(request, timeout=30) as response:
                  body = response.read()
                  return json.loads(body) if body else None

          assert api('/git/ref/heads/main')['object']['sha'] == sha, 'Main moved; refusing to tag a different source'
          pr = api('/pulls/7')
          assert pr['merged'] and pr['merge_commit_sha'] == sha
          for run_id in (35006760693, 35006760662):
              run = api('/actions/runs/' + str(run_id))
              assert run['status'] == 'completed' and run['conclusion'] == 'success', 'Required verification is not green'
              assert run['head_sha'] == '279452df3279b5da2f801c75a35ce91735aef684'
          try:
              current = api('/git/ref/tags/' + tag)
          except HTTPError as error:
              if error.code != 404:
                  raise
              current = api('/git/refs', {'ref': 'refs/tags/' + tag, 'sha': sha})
          assert current['object']['sha'] == sha, 'Existing tag points elsewhere; never overwrite a release tag'
          result = api('/actions/workflows/release-ruru.yml/dispatches', {'ref': tag, 'inputs': {'version_name': '0.1.1-ruru.1', 'version_code': '10101'}})
          print('Release dispatched for', tag, 'at', sha)
          if result:
              print(json.dumps(result))
          PY
