name: Ruru localization audit
on:
  push:
    branches: ['i18n/en-ru-only']
    paths: ['.github/workflows/i18n-audit.yml']
permissions:
  contents: read
concurrency:
  group: ruru-localization-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Audit locales and hardcoded UI strings
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee i18n-audit.txt) 2>&1
          echo '=== LOCALE DIRECTORIES ==='
          find shared/src/commonMain/composeResources -maxdepth 1 -type d -name 'values*' -printf '%f\n' | sort
          echo '=== LANGUAGE REFERENCES ==='
          grep -RInE --include='*.kt' --include='*.kts' --include='*.xml' 'AppLanguage|LocaleConfig|localeConfig|languageTag|languageCode|Persian|Farsi|Chinese|Simplified|فارسی|简体|zh-rCN|values-fa|values-zh' app shared || true
          echo '=== COMPOSE HARDCODED UI CANDIDATES ==='
          grep -RInE --include='*.kt' 'Text\("[A-Za-z]|contentDescription[[:space:]]*=[[:space:]]*"[A-Za-z]|title[[:space:]]*=[[:space:]]*"[A-Za-z]|label[[:space:]]*=[[:space:]]*"[A-Za-z]|placeholder[[:space:]]*=[[:space:]]*"[A-Za-z]' app shared | head -n 1200 || true
          echo '=== EXTENSION USER-FACING STRING CANDIDATES ==='
          grep -RInE --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' --exclude-dir=node_modules --exclude-dir=dist 'description:[[:space:]]*"[A-Za-z]|title:[[:space:]]*"[A-Za-z]|label:[[:space:]]*"[A-Za-z]|placeholder:[[:space:]]*"[A-Za-z]|message:[[:space:]]*"[A-Za-z]|name:[[:space:]]*"[A-Za-z]|text:[[:space:]]*"[A-Za-z]' extensions pi-bridge | head -n 2000 || true
          echo '=== ALL APP LANGUAGE DEFINITIONS ==='
          grep -RIn --include='*.kt' 'AppLanguage' app shared || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ruru-i18n-audit
          path: i18n-audit.txt
          retention-days: 7
