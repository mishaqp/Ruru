name: Ruru i18n branch sweep

on:
  push:
    branches:
      - 'fix/complete-russian-ui-0.1.2'

permissions:
  contents: write

concurrency:
  group: ruru-i18n-branch-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply localization sweep and print audit
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ruru-i18n-branch-sweep.py | tee ruru-i18n-sweep.log

      - name: Upload audit report
        uses: actions/upload-artifact@v7
        with:
          name: ruru-i18n-sweep-audit
          path: |
            ruru-i18n-audit.txt
            ruru-i18n-sweep.log
          retention-days: 14

      - name: Commit localization sweep
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f ruru-i18n-audit.txt ruru-i18n-sweep.log
          git rm scripts/ruru-i18n-branch-sweep.py .github/workflows/ruru-i18n-branch-sweep.yml
          git add pi-bridge/src/aether-extensions.ts pi-bridge/src/aether-ui-i18n.ts shared/src/commonMain/composeResources/values-ru/strings.xml
          git diff --cached --check
          git commit -m 'feat(i18n): localize runtime notifications and Agent Mode'
          git push origin HEAD:fix/complete-russian-ui-0.1.2
