name: Publish and verify stable 0.1.4-ruru.1
on:
  push:
    branches: ['release/verified-stable-0.1.4-ruru.1']
    paths: ['.github/workflows/publish-verified-stable.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: verified-stable-0.1.4-ruru.1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: e76a9e8e9966c3dd387f72ede2c9c96e73043450
      VERSION_NAME: 0.1.4-ruru.1
      VERSION_CODE: '10401'
    steps:
      - name: Dispatch the existing signed release after verified combined-main tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'mishaqp/Ruru'
          source = os.environ['SOURCE_SHA']
          version = os.environ['VERSION_NAME']
          code = int(os.environ['VERSION_CODE'])
          tag = 'v' + version
          def api(path, method='GET', data=None, missing=False):
              request = Request('https://api.github.com/repos/' + repo + '/' + path,
                  data=None if data is None else json.dumps(data).encode(), method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2026-03-10'})
              try:
                  with urlopen(request, timeout=45) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else {}
              except HTTPError as error:
                  if missing and error.code == 404: return None
                  raise RuntimeError(f'{method} {path}: HTTP {error.code}: {error.read().decode()[:600]}') from None
          # Reuse the successful test/build STEP of the previous run; its later
          # metadata-reading error occurred only after 407 tests and assembleDebug.
          run = api('actions/runs/35078121775')
          assert run['head_sha'] == '06381d146b44219e96e5430f88797827eaa04477'
          job = api('actions/jobs/104735267971')
          step = next(s for s in job['steps'] if s['name'] == 'Verify combined main, not an individual PR branch')
          assert step['conclusion'] == 'success', 'Combined-main tests/build were not successful'
          # Merge SHAs were returned by the successful guarded merge operations.
          merges = {12: 'e76a9e8e9966c3dd387f72ede2c9c96e73043450', 13: '9116128f397b67135aa399a5e9fa378ca3ed54e5'}
          for number, commit in merges.items():
              assert api(f'pulls/{number}')['merged'], f'PR {number} is not merged'
              comparison = api('compare/' + commit + '...' + source)
              assert comparison['status'] in ('ahead', 'identical'), f'PR {number} missing from release source'
          latest = api('releases/latest', missing=True)
          if latest:
              match = re.fullmatch(r'v?(\d+)\.(\d+)\.(\d+)-ruru\.(\d+)', latest['tag_name'])
              assert match, 'Cannot compare current stable version'
              major, minor, patch, revision = map(int, match.groups())
              assert code > major * 1000000 + minor * 10000 + patch * 100 + revision, 'Refusing an obsolete release'
          assert api('releases/tags/' + tag, missing=True) is None, 'Do not overwrite a published release'
          ref = api('git/ref/tags/' + tag, missing=True)
          if ref is None:
              api('git/refs', 'POST', {'ref': 'refs/tags/' + tag, 'sha': source})
          else:
              assert ref['object']['sha'] == source and ref['object']['type'] == 'commit', 'Tag targets different code'
          result = api('actions/workflows/release-ruru.yml/dispatches', 'POST', {
              'ref': tag, 'inputs': {'version_name': version, 'version_code': str(code)}})
          result.update({'tag': tag, 'source_sha': source, 'version_code': code})
          Path('stable-dispatch.json').write_text(json.dumps(result, indent=2))
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download and independently verify the published artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, time, zipfile
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          repo = os.environ['GITHUB_REPOSITORY']
          tag = 'v' + os.environ['VERSION_NAME']
          api_url = 'https://api.github.com/repos/' + repo + '/releases/tags/' + tag
          release = None
          apk_asset = None
          for _ in range(90):
              request = Request(api_url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              try:
                  with urlopen(request, timeout=45) as response: release = json.load(response)
                  assets = release.get('assets', [])
                  apk_asset = next((a for a in assets if a['name'] == 'Ruru-' + tag + '-arm64-v8a-release.apk' and a['state'] == 'uploaded'), None)
                  if apk_asset and not release.get('draft') and not release.get('prerelease'): break
              except HTTPError as error:
                  if error.code not in (404, 502, 503): raise
              time.sleep(10)
          assert apk_asset is not None, 'Signed release did not finish publishing in the verification window'
          apk = Path(apk_asset['name'])
          with urlopen(apk_asset['browser_download_url'], timeout=90) as response, apk.open('wb') as out:
              while chunk := response.read(1024 * 1024): out.write(chunk)
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          assert apk.stat().st_size == apk_asset['size']
          if apk_asset.get('digest'): assert apk_asset['digest'] == 'sha256:' + digest
          sdk = Path(os.environ.get('ANDROID_HOME', '/usr/local/lib/android/sdk'))
          tools = [p for p in (sdk / 'build-tools').iterdir() if (p / 'apksigner').exists() and (p / 'aapt2').exists()]
          assert tools, 'Android APK verification tools are unavailable'
          tools.sort(key=lambda p: tuple(int(x) for x in re.findall(r'\d+', p.name)))
          bt = tools[-1]
          signed = subprocess.check_output([str(bt / 'apksigner'), 'verify', '--verbose', '--print-certs', str(apk)], text=True)
          Path('published-apksigner.txt').write_text(signed)
          expected = '5bc56f9c3cdf31d0b4762ab15ca2a571350abd6f1ce81c1678ecb2e9bf47e850'
          certificates = re.findall(r'certificate SHA-256 digest:\s*([0-9a-fA-F:]+)', signed)
          assert certificates and all(c.replace(':','').lower() == expected for c in certificates)
          assert 'Number of signers: 1' in signed
          badging = subprocess.check_output([str(bt / 'aapt2'), 'dump', 'badging', str(apk)], text=True)
          Path('published-badging.txt').write_text(badging)
          assert "package: name='com.mishaqp.ruru'" in badging
          assert "versionName='" + os.environ['VERSION_NAME'] + "'" in badging
          assert "versionCode='" + os.environ['VERSION_CODE'] + "'" in badging
          assert 'application-debuggable' not in badging
          with zipfile.ZipFile(apk) as z:
              abis = sorted({p.split('/')[1] for p in z.namelist() if p.startswith('lib/') and p.endswith('.so')})
              assert abis == ['arm64-v8a'], abis
              manifest = z.read('AndroidManifest.xml')
              assert b'testOnly' not in manifest and 'testOnly'.encode('utf-16-le') not in manifest
          result = {'source_sha': os.environ['SOURCE_SHA'], 'version_name': os.environ['VERSION_NAME'], 'version_code': int(os.environ['VERSION_CODE']),
                    'package': 'com.mishaqp.ruru', 'abis': abis, 'signing_certificate_sha256': expected,
                    'apksigner_verification': 'PASS', 'sha256': digest, 'bytes': apk.stat().st_size, 'url': apk_asset['browser_download_url']}
          Path('published-apk-verification.json').write_text(json.dumps(result, indent=2))
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stable-release-verification
          path: |
            stable-dispatch.json
            published-apk-verification.json
            published-apksigner.txt
            published-badging.txt
          retention-days: 30
