name: Audit repair development
on:
  push:
    branches: ['fix/audit-stability-no-nightly']
    paths: ['.github/workflows/audit-development.yml', 'scripts/apply-audit-repairs.py']
permissions:
  contents: write
concurrency:
  group: audit-repair-development
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'mishaqp/Ruru' && github.ref == 'refs/heads/fix/audit-stability-no-nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/audit-stability-no-nightly
          fetch-depth: 0
      - name: Apply fail-closed source patches
        run: python3 scripts/apply-audit-repairs.py
      - name: Record exact source changes on the feature branch only
        run: |
          git add pi-bridge/src/aether-ui-i18n.ts pi-bridge/src/extension-dependencies.ts extensions/pi-subagents/src/agent-runner.ts extensions/pi-subagents/src/agent-manager.ts app/src/main/java/com/zhousl/aether/data/pi/PiKernelBridge.kt
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: protect UI data and honour startup cancellation'
            git push origin HEAD:refs/heads/fix/audit-stability-no-nightly
          fi
          git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked test dependencies
        working-directory: pi-bridge
        run: npm ci --no-audit --no-fund
      - name: Validate locales and TypeScript
        run: |
          python3 scripts/check-ruru-locales.py
          cd pi-bridge
          npm run check
      - name: Run all bridge and bundled-extension regression tests
        working-directory: pi-bridge
        shell: bash
        run: npm test 2>&1 | tee ../audit-repair-tests.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: audit-repair-tests
          path: audit-repair-tests.log
