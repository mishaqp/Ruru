name: Release verified Ruru 0.1.4-ruru.2
on:
  push:
    branches: ['ops/dispatch-ruru-0.1.4']
    paths: ['.github/workflows/dispatch-ruru-0.1.4.yml']
permissions:
  contents: write
  actions: write
jobs:
  dispatch:
    if: github.repository == 'mishaqp/Ruru' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Reserve an immutable source tag and dispatch only the normal signed release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source='e2e2bca7606d506c7e290e8cffac5b685ab9f124'
          tag='v0.1.4-ruru.2'
          # Creation fails if the name is occupied; never force/move an existing tag.
          gh api --method POST repos/mishaqp/Ruru/git/refs \
            -f ref="refs/tags/$tag" -f sha="$source"
          gh api --method POST repos/mishaqp/Ruru/actions/workflows/release-ruru.yml/dispatches \
            --input - <<'JSON'
          {"ref":"v0.1.4-ruru.2","inputs":{"version_name":"0.1.4-ruru.2","version_code":"10402"}}
          JSON
          echo 'Reserved v0.1.4-ruru.2 at reviewed e2e2bca and dispatched stable release. No Nightly.'
