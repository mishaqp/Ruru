name: Extension contract probe
on:
  push:
    branches: ['fix/audit-extension-contracts']
    paths: ['.github/workflows/audit-contract-probe.yml']
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: npm ci --no-audit --no-fund
        working-directory: pi-bridge
      - run: node --test tests/extension-contracts.test.mjs tests/web-provider-headers.test.mjs
        working-directory: pi-bridge
