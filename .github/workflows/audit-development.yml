name: Audit repair development
on:
  push:
    branches: ['fix/audit-stability-no-nightly']
    paths: ['.github/workflows/audit-development.yml', 'scripts/apply-audit-media.py']
permissions:
  contents: write
concurrency:
  group: audit-repair-development
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'mishaqp/Ruru' && github.ref == 'refs/heads/fix/audit-stability-no-nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/audit-stability-no-nightly
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked test dependencies
        working-directory: pi-bridge
        run: npm ci --no-audit --no-fund
      - name: Verify media regression fails on the old process implementation
        working-directory: pi-bridge
        shell: bash
        run: |
          if grep -q 'execFileSync' ../extensions/pi-web-access/video-extract.ts; then
            set +e
            node --test tests/audit-media.test.mjs > ../media-before.log 2>&1
            result=$?
            set -e
            cat ../media-before.log
            test "$result" -ne 0
            grep -q 'video processing blocked the event loop' ../media-before.log
            grep -q 'cancelled media was executed' ../media-before.log
          fi
      - name: Apply reviewed source patches
        run: python3 scripts/apply-audit-media.py
      - name: Record changes on feature branch only
        run: |
          git add extensions/pi-web-access/video-extract.ts extensions/pi-web-access/youtube-extract.ts extensions/pi-web-access/extract.ts app/src/main/java/com/zhousl/aether/runtime/BundledExtensionInstaller.kt
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: avoid blocking the agent during cancellable media extraction'
            git push origin HEAD:refs/heads/fix/audit-stability-no-nightly
          fi
          git rev-parse HEAD
      - name: Validate locale and TypeScript
        run: |
          python3 scripts/check-ruru-locales.py
          cd pi-bridge
          npm run check
          node node_modules/typescript/bin/tsc --noEmit --module NodeNext --target ES2024 --strict --skipLibCheck --typeRoots node_modules/@types --types node ../extensions/pi-web-access/media-process.ts
      - name: Run all bridge and bundled-extension regression tests
        working-directory: pi-bridge
        shell: bash
        run: npm test 2>&1 | tee ../audit-repair-tests.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: audit-media-results
          path: |
            audit-repair-tests.log
            media-before.log
