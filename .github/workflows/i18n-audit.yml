name: Ruru localization audit
on:
  push:
    branches: ['i18n/en-ru-only']
    paths: ['.github/workflows/i18n-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Audit locales and hardcoded UI strings
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== LOCALE DIRECTORIES ==='
            find shared/src/commonMain/composeResources -maxdepth 1 -type d -name 'values*' -printf '%f\n' | sort
            echo
            echo '=== LANGUAGE / LOCALE REFERENCES ==='
            rg -n --glob '!**/build/**' --glob '!**/node_modules/**' '(AppLanguage|LocaleConfig|localeConfig|languageTag|languageCode|Persian|Farsi|Chinese|Simplified|فارسی|简体|zh-rCN|values-fa|values-zh|\bfa\b|\bzh\b)' app shared | head -n 500 || true
            echo
            echo '=== ANDROID/COMPOSE HARD-CODED UI CANDIDATES ==='
            rg -n --glob '*.kt' --glob '!**/build/**' '(Text|title|label|contentDescription|placeholder|supportingText|message|description)\s*[=(][^\n]*"[A-Za-z][^"]*"' app shared | head -n 800 || true
            echo
            echo '=== EXTENSION USER-FACING STRING CANDIDATES ==='
            rg -n --glob '*.{ts,tsx,js,mjs,json}' --glob '!**/node_modules/**' --glob '!**/dist/**' '(title|label|description|message|placeholder|text|name|command|notify|error|status)\s*[:=]\s*[`"'"'][A-Za-z][^`"'"']*[`"'"']' extensions pi-bridge | head -n 1200 || true
            echo
            echo '=== XML / LOCALE FILES OUTSIDE COMPOSE RESOURCES ==='
            find app shared -type f \( -iname '*locale*' -o -iname '*language*' \) -print | sort
          } | tee i18n-audit.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ruru-i18n-audit
          path: i18n-audit.txt
          retention-days: 7
