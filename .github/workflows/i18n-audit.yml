name: Ruru localization audit
on:
  push:
    branches: ['i18n/en-ru-only']
    paths: ['.github/workflows/i18n-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Audit final locale policy and remaining UI literals
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee i18n-audit.txt) 2>&1
          python3 scripts/check-ruru-locales.py
          echo '=== LOCALE DIRECTORIES ==='
          find shared/src/commonMain/composeResources -maxdepth 1 -type d -name 'values*' -printf '%f\n' | sort
          echo '=== STALE REMOVED-LANGUAGE REFERENCES ==='
          grep -RInE --include='*.kt' --include='*.xml' 'SimplifiedChinese|AppLanguage\.Persian|zh-CN|values-fa|values-zh-rCN|language_persian|language_simplified_chinese' app/src/main shared/src/commonMain shared/src/androidMain shared/src/iosMain || true
          echo '=== CORE USER-VISIBLE ENGLISH LITERAL CANDIDATES ==='
          grep -RInE --include='*.kt' 'Text\("[A-Za-z]|contentDescription[[:space:]]*=[[:space:]]*"[A-Za-z]|title[[:space:]]*=[[:space:]]*"[A-Za-z][A-Za-z ]+"|placeholder[[:space:]]*=[[:space:]]*"[A-Za-z]' app/src/main shared/src/commonMain shared/src/androidMain | head -n 1200 || true
          echo '=== EXTENSION PRESENTATION LITERAL CANDIDATES ==='
          grep -RInE --include='aether.ts' '(title|subtitle|label|description|placeholder|message|text|runningTitle|completedTitle):[[:space:]]*["`][A-Za-z]' extensions | head -n 2000 || true
          echo '=== LOCALIZER COVERAGE STATS ==='
          python3 - <<'PY'
          from pathlib import Path
          import re
          loc=Path('pi-bridge/src/aether-ui-i18n.ts').read_text()
          dictionary=set(re.findall(r'^  "((?:[^"\\]|\\.)+)":', loc, re.M))
          candidates=[]
          pattern=re.compile(r'(?:title|subtitle|label|description|placeholder|message|text|runningTitle|completedTitle):\s*["`]([^"`$]+)["`]')
          for p in Path('extensions').rglob('aether.ts'):
              text=p.read_text(errors='ignore')
              for value in pattern.findall(text):
                  value=value.strip()
                  if value and value[0].isalpha(): candidates.append((str(p),value))
          unique={v for _,v in candidates}
          covered={v for v in unique if v in dictionary}
          print(f'exact static presentation literals: {len(unique)}; RU dictionary exact matches: {len(covered)}; unmatched: {len(unique-covered)}')
          for p,v in candidates:
              if v not in dictionary:
                  print(f'UNMATCHED {p}: {v}')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ruru-i18n-audit-final
          path: i18n-audit.txt
          retention-days: 7
