name: Apply extension contract repair
on:
  push:
    branches: ['fix/audit-extension-contracts']
    paths: ['.github/workflows/audit-contract-migrate.yml']
permissions:
  contents: write
concurrency:
  group: apply-extension-contract-repair
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - name: Apply the reviewed type-only migration
        run: python3 scripts/audit-contract-migrate.py
      - name: Lock check-time dependencies
        shell: bash
        run: |
          for dir in packages/extension-api extensions/pi-mcp-adapter extensions/pi-subagents extensions/pi-web-access; do
            (cd "$dir" && npm install --package-lock-only --ignore-scripts --include=optional --legacy-peer-deps --no-audit --no-fund)
          done
          git diff --check
      - name: Commit only scoped repair files
        id: commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/extension-api/package-lock.json extensions/pi-mcp-adapter/aether.ts extensions/pi-mcp-adapter/tsconfig.json extensions/pi-mcp-adapter/package-lock.json extensions/pi-subagents/src/aether.ts extensions/pi-subagents/tsconfig.json extensions/pi-subagents/package-lock.json extensions/pi-web-access/aether.ts extensions/pi-web-access/tsconfig.json extensions/pi-web-access/package.json extensions/pi-web-access/package-lock.json
          git commit -m 'fix: share bundled UI contracts and lock extension typecheck dependencies'
          git push origin HEAD:fix/audit-extension-contracts
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  check:
    needs: apply
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [pi-mcp-adapter, pi-subagents, pi-web-access]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.apply.outputs.commit }}
          persist-credentials: false
      - name: Build and check canonical SDK declarations
        run: |
          npm ci --prefix packages/extension-api --ignore-scripts --no-audit --no-fund
          npm run check --prefix packages/extension-api
      - name: Typecheck all package sources
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          cd "extensions/$PACKAGE"
          npm ci --ignore-scripts --include=optional --legacy-peer-deps --no-audit --no-fund
          npm run typecheck 2>&1 | tee ../../typecheck-$PACKAGE.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: repaired-contract-${{ matrix.package }}
          path: typecheck-*.log
          retention-days: 7
  guard:
    needs: apply
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.apply.outputs.commit }}
          persist-credentials: false
      - run: npm ci --no-audit --no-fund
        working-directory: pi-bridge
      - run: node --test tests/extension-contracts.test.mjs
        working-directory: pi-bridge
