name: Ruru i18n final grammar polish

on:
  push:
    branches:
      - 'fix/complete-russian-ui-0.1.2'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fix remaining Russian wording
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('shared/src/commonMain/composeResources/values-ru/strings.xml')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'авторизация Режим агента через Root готовы': 'авторизация режима агента через Root готовы',
              'переключит Режим агента на Root': 'переключит режим агента на Root',
              'Обновление авторизации Режим агента': 'Обновление авторизации режима агента',
              'Обновление дисплеев режиме агента': 'Обновление дисплеев режима агента',
              'Дисплеи Режим агента обновлены': 'Дисплеи режима агента обновлены',
              'Проверка авторизации Режим агента': 'Проверка авторизации режима агента',
              'Оставить Режим агента выключенным': 'Оставить режим агента выключенным',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          python3 scripts/check-ruru-locales.py
          git diff --check

      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ruru-i18n-polish-final.yml
          git add shared/src/commonMain/composeResources/values-ru/strings.xml
          git diff --cached --check
          git commit -m 'fix(i18n): finish Russian Agent Mode grammar polish'
          git push origin HEAD:fix/complete-russian-ui-0.1.2
