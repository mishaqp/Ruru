name: Apply final localization pass
# Rerun after restoring the complete archive regression test.
on:
  push:
    branches: ['i18n/en-ru-only']
    paths: ['.github/workflows/apply-final-i18n.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Apply final localization changes
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/i18n/en-ru-only
          python3 scripts/apply-final-i18n.py
          python3 scripts/check-ruru-locales.py
      - name: Verify bridge and localized extensions
        working-directory: pi-bridge
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run check
          npm test
      - name: Build and test Android/shared code
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :shared:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Commit verified changes
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(i18n): finish Russian UI localization across core and bundled extensions'
          git push origin HEAD:refs/heads/i18n/en-ru-only
