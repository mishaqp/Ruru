name: Audit boundary verification (temporary)
on:
  push:
    branches: ['fix/audit-runtime-boundaries']
    paths: ['scripts/audit-boundaries-step.py', '.github/workflows/audit-boundaries-dev.yml']
permissions:
  contents: write
concurrency:
  group: audit-boundaries-dev
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'mishaqp/Ruru' && github.ref == 'refs/heads/fix/audit-runtime-boundaries'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/audit-runtime-boundaries
      - name: Apply exact reviewed edits on the isolated branch
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/audit-boundaries-step.py
          git diff --check
          git add pi-bridge app/src shared/src packages/extension-api docs
          if ! git diff --cached --quiet; then
            git config user.name 'mishaqp'
            git config user.email '84035331+mishaqp@users.noreply.github.com'
            git commit -m 'test: use verified bridge RPC names for regression reproducers'
            git push origin HEAD:refs/heads/fix/audit-runtime-boundaries
          fi
      - name: Install bridge dependencies
        working-directory: pi-bridge
        run: npm ci --no-audit --no-fund
      - name: Build bridge
        working-directory: pi-bridge
        run: npm run build
      - name: Reproduce remaining runtime findings
        working-directory: pi-bridge
        shell: bash
        run: node --test tests/runtime-boundaries.test.mjs 2>&1 | tee ../boundary-tests.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: boundary-reproduction
          path: boundary-tests.log
