name: Android audit regression work
on:
  push:
    branches: ['fix/android-only-audit-followup']
permissions:
  contents: write
concurrency:
  group: android-audit-work
  cancel-in-progress: true
jobs:
  repair_android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/android-only-audit-followup
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          cache-read-only: false
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Apply reviewed Android changes
        run: python3 scripts/apply-android-followup.py
      - name: Check locales, bridge types and runtime
        shell: bash
        run: |
          python3 scripts/check-ruru-locales.py
          cd pi-bridge
          npm ci --no-audit --no-fund
          npm run check
          npm test 2>&1 | tee ../runtime-green.log
      - name: Android and shared unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :shared:testDebugUnitTest :app:testDebugUnitTest --stacktrace
      - name: Build only Android arm64-v8a debug verification APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace
          python3 scripts/check-ruru-bundle-assets.py app/build/outputs/apk/debug/*.apk
      - name: Commit verified changes on working branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/zhousl/aether/data/pi/PiKernelBridge.kt app/src/main/java/com/zhousl/aether/data/PiExtensionManager.kt app/src/main/java/com/zhousl/aether/data/AetherSelfManagementTool.kt app/build.gradle.kts pi-bridge/tests/extension-deadline.test.mjs
          git rm scripts/apply-android-followup.py .github/workflows/android-audit-work.yml
          git diff --cached --check
          git commit -m 'fix(android): bound bridge events and report deferred package removal'
          git push origin HEAD:refs/heads/fix/android-only-audit-followup
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-audit-green
          path: |
            runtime-green.log
            app/build/test-results/**
            shared/build/test-results/**
          retention-days: 7
