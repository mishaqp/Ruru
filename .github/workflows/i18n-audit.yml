name: Ruru localization audit
on:
  push:
    branches: ['i18n/en-ru-only']
    paths: ['.github/workflows/i18n-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Audit locales and hardcoded UI strings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee i18n-audit.txt
          from pathlib import Path
          import os, re

          SKIP={'.git','build','node_modules','dist','.gradle'}
          def files(base, suffixes):
              for root, dirs, names in os.walk(base):
                  dirs[:] = [d for d in dirs if d not in SKIP]
                  for name in names:
                      p=Path(root)/name
                      if p.suffix in suffixes: yield p

          print('=== LOCALE DIRECTORIES ===')
          root=Path('shared/src/commonMain/composeResources')
          for p in sorted(root.glob('values*')):
              if p.is_dir(): print(p.name)

          print('\n=== LANGUAGE / LOCALE REFERENCES ===')
          lang=re.compile(r'AppLanguage|LocaleConfig|localeConfig|languageTag|languageCode|Persian|Farsi|Chinese|Simplified|فارسی|简体|zh-rCN|values-fa|values-zh|["\']fa["\']|["\']zh(?:-CN)?["\']')
          for base in ('app','shared'):
              for p in files(base,{'.kt','.kts','.xml','.json','.plist','.gradle'}):
                  for n,line in enumerate(p.read_text(errors='ignore').splitlines(),1):
                      if lang.search(line): print(f'{p}:{n}:{line.strip()}')

          print('\n=== ANDROID/COMPOSE HARD-CODED UI CANDIDATES ===')
          ui=re.compile(r'(?:Text|title|label|contentDescription|placeholder|supportingText|message|description)\s*[=(][^\n]*["\'][A-Za-z][^"\']*["\']')
          count=0
          for base in ('app','shared'):
              for p in files(base,{'.kt'}):
                  for n,line in enumerate(p.read_text(errors='ignore').splitlines(),1):
                      if ui.search(line):
                          print(f'{p}:{n}:{line.strip()}'); count+=1
                          if count>=1200: break
                  if count>=1200: break
              if count>=1200: break

          print('\n=== EXTENSION USER-FACING STRING CANDIDATES ===')
          ext=re.compile(r'(?:title|label|description|message|placeholder|text|name|command|notify|error|status)\s*[:=]\s*[`"\'][A-Za-z][^`"\']*[`"\']')
          count=0
          for base in ('extensions','pi-bridge'):
              for p in files(base,{'.ts','.tsx','.js','.mjs','.json'}):
                  for n,line in enumerate(p.read_text(errors='ignore').splitlines(),1):
                      if ext.search(line):
                          print(f'{p}:{n}:{line.strip()}'); count+=1
                          if count>=1600: break
                  if count>=1600: break
              if count>=1600: break

          print('\n=== XML / LOCALE FILES OUTSIDE COMPOSE RESOURCES ===')
          for base in ('app','shared'):
              for p in files(base,{'.kt','.xml','.plist'}):
                  if 'locale' in p.name.lower() or 'language' in p.name.lower(): print(p)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: ruru-i18n-audit
          path: i18n-audit.txt
          retention-days: 7
