name: Apply extension contract repair
on:
  push:
    branches: ['fix/audit-extension-contracts']
    paths: ['.github/workflows/audit-contract-migrate.yml']
permissions:
  contents: write
concurrency:
  group: apply-extension-contract-repair
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - name: Apply reviewed header corrections
        run: python3 scripts/audit-contract-headers.py
      - name: Commit only verified adapter corrections
        id: commit
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extensions/pi-web-access/openai-search.ts extensions/pi-web-access/xai-search.ts extensions/pi-web-access/index.ts extensions/pi-web-access/summary-review.ts
          git commit -m 'fix: align Web Access nullable headers with the pinned Pi client'
          git push origin HEAD:fix/audit-extension-contracts
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  check:
    needs: apply
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [pi-mcp-adapter, pi-subagents, pi-web-access]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.apply.outputs.commit }}
          persist-credentials: false
      - name: Full typecheck and invalid-type coverage probe
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
        run: node scripts/check-bundled-extensions.mjs "$PACKAGE" 2>&1 | tee typecheck-$PACKAGE.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: repaired-contract-${{ matrix.package }}
          path: typecheck-*.log
          retention-days: 7
  regression:
    needs: apply
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.apply.outputs.commit }}
          persist-credentials: false
      - run: python3 scripts/check-ruru-locales.py
      - run: npm ci --no-audit --no-fund
        working-directory: pi-bridge
      - run: npm run check
        working-directory: pi-bridge
      - run: npm test 2>&1 | tee ../regression.log
        shell: bash
        working-directory: pi-bridge
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: repaired-contract-regressions
          path: regression.log
          retention-days: 7
